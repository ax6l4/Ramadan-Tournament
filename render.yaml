# نشر موقع فريق الروضة — رابط دائم يعمل حتى مع إغلاق اللابتوب
#
# مهم: خدمة الويب وقاعدة البيانات يجب أن تكونا في نفس المنطقة
# وإلا يظهر الخطأ: getaddrinfo ENOTFOUND dpg-xxxxx-a

services:
  - type: web
    name: fariq-alrawdha
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Abdul Rahman
      - key: ADMIN_PASSWORD
        value: Aa91141702
      # Internal connection string (يعمل فقط إذا كانت الخدمة والـ DB في نفس المنطقة)
      - key: DATABASE_URL
        fromDatabase:
          name: fariq-alrawdha-db
          property: connectionString

databases:
  - name: fariq-alrawdha-db
    plan: free
    region: frankfurt
    databaseName: alrawdha
    user: alrawdha

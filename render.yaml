# Web service + Postgres must be in the SAME region
# otherwise DATABASE_URL internal host (dpg-xxxxx-a) causes:
# getaddrinfo ENOTFOUND dpg-xxxxx-a

services:
  - type: web
    name: fariq-alrawdha
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Abdul Rahman
      - key: ADMIN_PASSWORD
        value: Aa91141702
      - key: DATABASE_URL
        fromDatabase:
          name: fariq-alrawdha-db
          property: connectionString

databases:
  - name: fariq-alrawdha-db
    plan: free
    region: frankfurt
    databaseName: alrawdha
    user: alrawdha

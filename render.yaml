# Web service and Postgres must share the same region.
# A mismatched region makes the internal host (dpg-xxxxx-a) unresolvable.

services:
  - type: web
    name: fariq-alrawdha
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fariq-alrawdha-db
          property: connectionString

databases:
  - name: fariq-alrawdha-db
    plan: free
    region: frankfurt
    databaseName: alrawdha
    user: alrawdha

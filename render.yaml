# نشر موقع فريق الروضة — رابط دائم يعمل حتى مع إغلاق اللابتوب
services:
  - type: web
    name: fariq-alrawdha
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Abdul Rahman
      - key: ADMIN_PASSWORD
        value: Aa91141702
      - key: DATABASE_URL
        fromDatabase:
          name: fariq-alrawdha-db
          property: connectionString

databases:
  - name: fariq-alrawdha-db
    plan: free
    databaseName: alrawdha
    user: alrawdha
